<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Sekolah</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 10px;
      min-height: 40px;
    }

    #scannerArea {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ========================= -->
  <!-- LOGIN -->
  <!-- ========================= -->

  <div id="loginArea">

    <h2>🏫 Absensi Sekolah</h2>

    <p>Login Guru Piket</p>

    <input
      type="tel"
      id="noHp"
      placeholder="Nomor HP"
      autocomplete="tel"
    >

    <br>

    <button onclick="loginPetugas()">
      MASUK
    </button>

    <div id="loginHasil"></div>

  </div>


  <!-- ========================= -->
  <!-- SCANNER -->
  <!-- ========================= -->

  <div id="scannerArea">
    <div id="manualArea" style="display:none;">

  <h2>📝 Absen Manual</h2>

  <p id="manualPetugas"></p>

  <input
    type="text"
    id="manualKode"
    placeholder="Masukkan ID siswa, contoh S003"
  >

  <br>

  <button onclick="simpanManual('SAKIT')">
    SAKIT
  </button>

  <button onclick="simpanManual('IZIN')">
    IZIN
  </button>

  <br><br>

  <button onclick="simpanManual('KEGIATAN')">
    KEGIATAN SEKOLAH
  </button>

  <br><br>

  <input
    type="text"
    id="manualKeterangan"
    placeholder="Keterangan (opsional)"
  >

  <div id="manualHasil"></div>

  <br>

  <button onclick="tampilkanScanner()">
    ← KEMBALI KE SCANNER
  </button>

</div>

    <h2>📷 Scanner Absensi</h2>

    <div id="petugasInfo"></div>
    <div id="menuArea">

  <button onclick="tampilkanScanner()">
    📷 SCAN ABSEN
  </button>

  <button onclick="tampilkanManual()">
    📝 ABSEN MANUAL
  </button>

</div>

    <div id="reader"></div>

    <div id="hasil">
      Siap melakukan scan.
    </div>

  </div>

</div>


<script>

  // =====================================================
  // URL WEB APP GAS
  // =====================================================

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbxSXinXPPm7qIl_5J99eMKfsHEo-nCZ8MWI-KNt0KsnR4W7mTL-uE4dagGneVg3c_aX/exec";


  // =====================================================
  // DATA PETUGAS YANG LOGIN
  // =====================================================

  let petugas = null;


  // =====================================================
  // LOGIN
  // =====================================================

  function loginPetugas() {

    const noHp =
      document.getElementById("noHp").value.trim();

    if (!noHp) {

      document.getElementById("loginHasil").innerHTML =
        "<p>Masukkan nomor HP.</p>";

      return;
    }


    document.getElementById("loginHasil").innerHTML =
      "Memeriksa akun...";


    const callbackName =
      "loginCallback" + Date.now();


    window[callbackName] = function(data) {

      if (data.berhasil === true) {

        petugas = {
          idPetugas: data.idPetugas,
          nama: data.nama
        };


        document.getElementById("loginArea").style.display =
          "none";

        document.getElementById("scannerArea").style.display =
          "block";


        document.getElementById("petugasInfo").innerHTML =
          "<b>Petugas:</b> " +
          data.nama +
          "<br>" +
          "ID: " +
          data.idPetugas;


        mulaiScanner();

      } else {

        document.getElementById("loginHasil").innerHTML =
          "<p>❌ " +
          data.pesan +
          "</p>";
      }


      delete window[callbackName];

      const script =
        document.getElementById("loginApi");

      if (script) {
        script.remove();
      }
    };


    const script =
      document.createElement("script");

    script.id = "loginApi";


    script.src =
      GAS_URL +
      "?aksi=login" +
      "&noHp=" +
      encodeURIComponent(noHp) +
      "&callback=" +
      callbackName;


    document.body.appendChild(script);
  }
function tampilkanManual() {

  document.getElementById("scannerArea").style.display =
    "none";

  document.getElementById("manualArea").style.display =
    "block";

  document.getElementById("manualPetugas").innerHTML =
    "<b>Petugas:</b> " +
    petugas.nama +
    " (" +
    petugas.idPetugas +
    ")";

  document.getElementById("manualHasil").innerHTML =
    "";

}

  function tampilkanScanner() {

  document.getElementById("manualArea").style.display =
    "none";

  document.getElementById("scannerArea").style.display =
    "block";

  document.getElementById("manualHasil").innerHTML =
    "";

  mulaiScanner();

}
  function simpanManual(status) {

  const kode =
    document.getElementById("manualKode").value.trim();

  const keterangan =
    document.getElementById("manualKeterangan").value.trim();

  if (!kode) {

    document.getElementById("manualHasil").innerHTML =
      "⚠️ Masukkan ID siswa terlebih dahulu.";

    return;
  }

  document.getElementById("manualHasil").innerHTML =
    "Menyimpan...";


  const callbackName =
    "manualCallback" + Date.now();


  window[callbackName] = function(data) {

    if (data.berhasil === true) {

      document.getElementById("manualHasil").innerHTML =

        "<b>✓ BERHASIL</b><br><br>" +

        "Siswa: <b>" +
        data.nama +
        "</b><br>" +

        "ID: " +
        data.idSiswa +
        "<br>" +

        "Mode: " +
        data.mode +
        "<br>" +

        "Status: <b>" +
        data.status +
        "</b><br>" +

        "Petugas: " +
        data.idPetugas;

      document.getElementById("manualKode").value = "";

      document.getElementById("manualKeterangan").value = "";

    } else {

      document.getElementById("manualHasil").innerHTML =

        "<b>❌ GAGAL</b><br><br>" +

        (data.pesan ||
        "Terjadi kesalahan.");
    }


    delete window[callbackName];


    const script =
      document.getElementById("manualApi");

    if (script) {
      script.remove();
    }

  };


  const script =
    document.createElement("script");

  script.id = "manualApi";


  script.src =
    GAS_URL +
    "?aksi=manual" +
    "&kode=" +
    encodeURIComponent(kode) +
    "&status=" +
    encodeURIComponent(status) +
    "&idPetugas=" +
    encodeURIComponent(
      petugas.idPetugas
    ) +
    "&keterangan=" +
    encodeURIComponent(
      keterangan
    ) +
    "&callback=" +
    callbackName;


  document.body.appendChild(script);

}

  // =====================================================
  // SCAN BERHASIL
  // =====================================================

  function berhasilScan(kode) {

    document.getElementById("hasil").innerHTML =
      "<b>Barcode terbaca!</b><br><br>" +
      "Kode: " +
      kode +
      "<br><br>" +
      "Mencatat kehadiran...";


    catatKehadiran(kode);
  }


  // =====================================================
  // CATAT KEHADIRAN
  // =====================================================

  function catatKehadiran(kode) {

    const callbackName =
      "absenCallback" + Date.now();


    window[callbackName] = function(data) {

      if (data.berhasil === true) {

        document.getElementById("hasil").innerHTML =
          "<b>✓ ABSENSI BERHASIL</b><br><br>" +

          "<strong>" +
          data.nama +
          "</strong><br>" +

          data.tingkat +
          " - " +
          data.jurusan +
          "<br>" +

          data.kelas +
          "<br><br>" +

          "Mode: <b>" +
          data.mode +
          "</b><br>" +

          "Jam: <b>" +
          data.jam +
          "</b><br>" +

          "Status: <b>" +
          data.status +
          "</b><br>" +

          "Apel: <b>" +
          data.apel +
          "</b>";

      } else {

        document.getElementById("hasil").innerHTML =
          "<b>❌ GAGAL</b><br><br>" +
          (data.pesan || "Terjadi kesalahan.");
      }


      delete window[callbackName];


      const script =
        document.getElementById("absenApi");

      if (script) {
        script.remove();
      }


      setTimeout(function() {

        mulaiScanner();

      }, 3000);

    };


    const script =
      document.createElement("script");

    script.id = "absenApi";


  script.src =
  GAS_URL +
  "?aksi=absen" +
  "&kode=" +
  encodeURIComponent(kode) +
  "&idPetugas=" +
  encodeURIComponent(petugas.idPetugas) +
  "&callback=" +
  callbackName;


    document.body.appendChild(script);
  }


  // =====================================================
  // ERROR SCAN
  // =====================================================

  function gagalScan(error) {
    // Abaikan error pembacaan frame kamera.
  }


  // =====================================================
  // MULAI SCANNER
  // =====================================================

  function mulaiScanner() {

    document.getElementById("reader").innerHTML = "";


    const scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 150
          }
        },

        false
      );


    scanner.render(
      function(kode) {

        scanner.clear();

        berhasilScan(kode);

      },

      gagalScan
    );
  }

</script>

</body>
</html>
