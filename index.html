<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Sekolah</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 10px;
      min-height: 40px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 Absensi Sekolah</h2>

  <p>Scanner barcode siswa</p>

  <div id="reader"></div>

  <div id="hasil">
    Siap melakukan scan.
  </div>

</div>

<script>

  // =====================================================
  // URL WEB APP GOOGLE APPS SCRIPT
  // =====================================================

  const GAS_URL = "https://script.google.com/macros/s/AKfycbxSXinXPPm7qIl_5J99eMKfsHEo-nCZ8MWI-KNt0KsnR4W7mTL-uE4dagGneVg3c_aX/exec";


  // =====================================================
  // SAAT QR BERHASIL DIBACA
  // =====================================================

  function berhasilScan(kode) {

    document.getElementById("hasil").innerHTML =
      "<b>Barcode terbaca!</b><br><br>" +
      "Kode: " + kode +
      "<br><br>" +
      "Mencatat kehadiran...";

    catatKehadiran(kode);
  }


  // =====================================================
  // KIRIM KODE KE GAS
  // =====================================================

  function catatKehadiran(kode) {

    const callbackName =
      "callbackAbsen" + Date.now();

    window[callbackName] = function(data) {

      if (data.berhasil === true) {

        document.getElementById("hasil").innerHTML =
          "<b>✓ ABSENSI BERHASIL</b><br><br>" +
          "<strong>" + data.nama + "</strong><br>" +
          data.tingkat + " - " +
          data.jurusan + "<br>" +
          data.kelas + "<br><br>" +
          "Jam: <b>" + data.jam + "</b><br>" +
          "Status: <b>" + data.status + "</b><br>" +
          "Apel: <b>" + data.apel + "</b>";

      } else if (data.sudahAbsen === true) {

        document.getElementById("hasil").innerHTML =
          "<b>⚠ SUDAH ABSEN</b><br><br>" +
          "<strong>" + data.nama + "</strong><br>" +
          "Siswa sudah melakukan absensi hari ini.";

      } else {

        document.getElementById("hasil").innerHTML =
          "<b>❌ GAGAL</b><br><br>" +
          (data.pesan || "Terjadi kesalahan.");
      }

      delete window[callbackName];

      const script =
        document.getElementById("gasApi");

      if (script) {
        script.remove();
      }

      setTimeout(function() {
        mulaiScanner();
      }, 3000);
    };


    const script =
      document.createElement("script");

    script.id = "gasApi";

    script.src =
      GAS_URL +
      "?aksi=absen" +
      "&kode=" +
      encodeURIComponent(kode) +
      "&callback=" +
      callbackName;

    document.body.appendChild(script);
  }


  // =====================================================
  // ERROR PEMBACAAN QR
  // =====================================================

  function gagalScan(error) {
    // Tidak perlu menampilkan error setiap frame.
  }


  // =====================================================
  // MULAI KAMERA
  // =====================================================

  function mulaiScanner() {

    document.getElementById("reader").innerHTML = "";

    const scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 150
          }
        },

        false
      );

    scanner.render(
      function(kode) {

        scanner.clear();

        berhasilScan(kode);

      },

      gagalScan
    );
  }


  // =====================================================
  // JALANKAN SCANNER
  // =====================================================

  mulaiScanner();

</script>

</body>
</html>
