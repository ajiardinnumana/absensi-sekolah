<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Sekolah</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 Absensi Sekolah</h2>

  <p>Uji coba scanner barcode</p>

  <div id="reader"></div>

  <div id="hasil">
    Belum ada scan.
  </div>

</div>

<script>

 function berhasilScan(kode) {

  document.getElementById("hasil").innerHTML =
    "<b>Barcode terbaca!</b><br><br>" +
    "Kode: " + kode +
    "<br><br>" +
    "Mencatat kehadiran...";

  catatKehadiran(kode);
}

  function catatKehadiran(kode) {

  const callbackName =
    "callbackAbsen" + Date.now();

  window[callbackName] = function(data) {

    if (data.berhasil) {

      document.getElementById("hasil").innerHTML =
        "<b>✓ ABSENSI BERHASIL</b><br><br>" +

        "<strong>" + data.nama + "</strong><br>" +

        data.tingkat + " - " +
        data.jurusan + "<br>" +

        data.kelas + "<br><br>" +

        "Jam: <b>" + data.jam + "</b><br>" +

        "Status: <b>" +
        data.status +
        "</b><br>" +

        "Apel: <b>" +
        data.apel +
        "</b>";

    } else if (data.sudahAbsen) {

      document.getElementById("hasil").innerHTML =
        "<b>⚠ SUDAH ABSEN</b><br><br>" +

        "<strong>" + data.nama + "</strong><br>" +

        "Siswa sudah melakukan absensi hari ini.";

    } else {

      document.getElementById("hasil").innerHTML =
        "<b>❌ GAGAL</b><br><br>" +
        data.pesan;
    }

    delete window[callbackName];

    const script =
      document.getElementById("gasApi");

    if (script) {
      script.remove();
    }

    setTimeout(function() {
      mulaiScanner();
    }, 3000);
  };


  const script =
    document.createElement("script");

  script.id = "gasApi";

  script.src =
    GAS_URL +
    "?aksi=absen" +
    "&kode=" +
    encodeURIComponent(kode) +
    "&callback=" +
    callbackName;

  document.body.appendChild(script);
}

</script>

</body>
</html>
