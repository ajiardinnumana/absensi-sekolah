<script>

  // GANTI dengan URL Web App GAS milikmu
  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbxSXinXPPm7qIl_5J99eMKfsHEo-nCZ8MWI-KNt0KsnR4W7mTL-uE4dagGneVg3c_aX/exec";


  function berhasilScan(kode) {

    document.getElementById("hasil").innerHTML =
      "<strong>Barcode terbaca!</strong><br><br>" +
      "Kode: " + kode +
      "<br><br>Mencari data siswa...";

    cariDataSiswa(kode);
  }


  function cariDataSiswa(kode) {

    const callbackName =
      "hasilSiswa_" + Date.now();

    window[callbackName] = function(data) {

      if (data.ditemukan) {

        document.getElementById("hasil").innerHTML =
          "<strong>✓ SISWA DITEMUKAN</strong><br><br>" +

          "<b>" + data.nama + "</b><br>" +

          data.tingkat + " - " +
          data.jurusan + "<br>" +

          data.kelas + "<br><br>" +

          "ID: " + data.idSiswa;

      } else {

        document.getElementById("hasil").innerHTML =
          "<strong>❌ SISWA TIDAK DITEMUKAN</strong><br><br>" +
          "Kode: " + kode;
      }

      delete window[callbackName];
      document.getElementById("apiScript").remove();

      // Aktifkan scanner kembali
      setTimeout(function() {
        mulaiScanner();
      }, 2500);
    };


    const script = document.createElement("script");

    script.id = "apiScript";

    script.src =
      GAS_URL +
      "?kode=" + encodeURIComponent(kode) +
      "&callback=" + callbackName;

    document.body.appendChild(script);
  }


  function gagalScan(error) {
    // Error frame kamera tidak perlu ditampilkan
  }


  function mulaiScanner() {

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 150
        }
      },
      false
    );

    scanner.render(
      function(kode) {

        scanner.clear();

        berhasilScan(kode);

      },
      gagalScan
    );
  }


  mulaiScanner();

</script>
