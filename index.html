<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Sekolah</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 Absensi Sekolah</h2>

  <p>Uji coba scanner barcode</p>

  <div id="reader"></div>

  <div id="hasil">
    Belum ada scan.
  </div>

</div>

<script>

  function berhasilScan(kode) {

    document.getElementById("hasil").innerHTML =
      "<strong>Barcode terbaca!</strong><br><br>" +
      "Kode: " + kode;
  }

  function gagalScan(error) {
    // Abaikan error pembacaan frame kamera.
  }

  const scanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 150
      }
    },
    false
  );

  scanner.render(
    berhasilScan,
    gagalScan
  );

</script>

</body>
</html>
