<script>


  // =====================================================
  // HAMBURGER MENU
  // =====================================================

  function toggleMenu() {
    const drawer = document.getElementById("menuDrawer");
    const toggle = document.querySelector(".menu-toggle");

    if (!drawer || !toggle) return;

    const open = drawer.classList.toggle("open");

    toggle.setAttribute(
      "aria-expanded",
      open ? "true" : "false"
    );
  }

  function closeMenu() {
    const drawer = document.getElementById("menuDrawer");
    const toggle = document.querySelector(".menu-toggle");

    if (drawer) {
      drawer.classList.remove("open");
    }

    if (toggle) {
      toggle.setAttribute("aria-expanded", "false");
    }
  }

  document.addEventListener("click", function(event) {
    const menu = document.getElementById("menuArea");
    const drawer = document.getElementById("menuDrawer");

    if (
      menu &&
      drawer &&
      !menu.contains(event.target)
    ) {
      closeMenu();
    }
  });


  // =====================================================
  // URL WEB APP GOOGLE APPS SCRIPT
  // =====================================================

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbxSXinXPPm7qIl_5J99eMKfsHEo-nCZ8MWI-KNt0KsnR4W7mTL-uE4dagGneVg3c_aX/exec";


  // =====================================================
  // DATA PETUGAS
  // =====================================================

  let petugas = null;


  // =====================================================
  // OBJEK SCANNER
  // =====================================================

  let scannerAktif = null;


  // =====================================================
  // MEMBERSIHKAN CALLBACK
  // =====================================================

  function bersihkanCallback(
    scriptId,
    callbackName
  ) {

    delete window[callbackName];

    const script =
      document.getElementById(scriptId);

    if (script) {
      script.remove();
    }

  }


  // =====================================================
  // LOGIN PETUGAS
  // =====================================================

  function loginPetugas() {

    const input =
      document.getElementById("noHp");

    const hasil =
      document.getElementById("loginHasil");

    const noHp =
      input.value.trim();


    if (!noHp) {

      hasil.innerHTML =
        "⚠️ Masukkan nomor HP.";

      return;

    }


    hasil.innerHTML =
      "Memeriksa akun...";


    const callbackName =
      "loginCallback" + Date.now();


    window[callbackName] =
      function(data) {

        if (
          data &&
          data.berhasil === true
        ) {

          petugas = {

            idPetugas:
              data.idPetugas,

            nama:
              data.nama

          };


          // Sembunyikan login

          document
            .getElementById("loginArea")
            .style.display =
              "none";


          // Tampilkan scanner

          document
            .getElementById("scannerArea")
            .style.display =
              "block";


          // Informasi petugas

          document
            .getElementById("petugasInfo")
            .innerHTML =

              "<b>Petugas:</b> " +
              data.nama +

              "<br>" +

              "<b>ID:</b> " +
              data.idPetugas;


          // Tampilkan status hari ini
          cekStatusHariIni();

          // Mulai scanner
          mulaiScanner();


        } else {

          hasil.innerHTML =

            "❌ " +

            (
              data &&
              data.pesan
                ? data.pesan
                : "Login gagal."
            );

        }


        bersihkanCallback(
          "loginApi",
          callbackName
        );

      };


    const script =
      document.createElement("script");


    script.id =
      "loginApi";


    script.src =

      GAS_URL +

      "?aksi=login" +

      "&noHp=" +
      encodeURIComponent(noHp) +

      "&callback=" +
      callbackName;


    document.body.appendChild(script);

  }



  // =====================================================
  // STATUS HARI INI
  // =====================================================

  function cekStatusHariIni() {
    const area =
      document.getElementById("statusHariIni");

    if (!area) {
      return;
    }

    const tanggal =
      tanggalHariIniLocal();

    area.innerHTML =
      "⏳ Memeriksa status hari ini...";

    const callbackName =
      "statusHariIniCallback" + Date.now();

    window[callbackName] = function(data) {
      if (!data || data.berhasil !== true) {
        area.innerHTML =
          "⚠️ Status hari belum dapat diperiksa.";
        bersihkanCallback(
          "statusHariIniApi",
          callbackName
        );
        return;
      }

      const hari =
        data.hari || "";

      const isLibur =
        data.libur === true ||
        String(data.status || "").toUpperCase() === "LIBUR";

      if (isLibur) {
        area.innerHTML =
          "🔴 <b>HARI LIBUR</b>" +
          "<br>" +
          escapeHtmlLibur(hari) +
          "<br>" +
          escapeHtmlLibur(
            data.keterangan || "Hari libur"
          );
      } else {
        area.innerHTML =
          "🟢 <b>HARI SEKOLAH</b>" +
          "<br>" +
          escapeHtmlLibur(hari) +
          "<br>" +
          "Absensi berjalan normal.";
      }

      bersihkanCallback(
        "statusHariIniApi",
        callbackName
      );
    };

    const script =
      document.createElement("script");

    script.id = "statusHariIniApi";

    script.src =
      GAS_URL +
      "?aksi=cekLibur" +
      "&tanggal=" +
      encodeURIComponent(tanggal) +
      "&callback=" +
      callbackName;

    document.body.appendChild(script);
  }

  // =====================================================
  // CARI SISWA MANUAL
  // =====================================================

  function cariSiswaManual() {

    const teks =
      document
        .getElementById("manualCari")
        .value
        .trim();


    const hasil =
      document.getElementById(
        "hasilPencarianManual"
      );


    if (!teks) {

      hasil.innerHTML = "";

      document
        .getElementById("manualKode")
        .value = "";

      return;

    }


    hasil.innerHTML =
      "Mencari siswa...";


    const callbackName =
      "cariManualCallback" + Date.now();


    window[callbackName] =
      function(data) {

        if (
          !data ||
          data.berhasil !== true ||
          !Array.isArray(data.data) ||
          data.data.length === 0
        ) {

          hasil.innerHTML =
            "❌ Siswa tidak ditemukan.";

          bersihkanCallback(
            "cariManualApi",
            callbackName
          );

          return;

        }


        let html = "";


        data.data.forEach(
          function(siswa) {

            const id =
              String(
                siswa.idSiswa || ""
              );

            const nama =
              String(
                siswa.nama || ""
              );


            const tingkat =
              String(
                siswa.tingkat || ""
              );

            const jurusan =
              String(
                siswa.jurusan || ""
              );

            const kelas =
              String(
                siswa.kelas || ""
              );


            const idAman =
              id
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");


            const namaAman =
              nama
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");


            html +=

              "<button " +

              "type='button' " +

              "class='pilihan-siswa' " +

              "onclick=\"pilihSiswaManual('" +

              idAman +

              "','" +

              namaAman +

              "')\">" +

              "<b>" +
              id +
              "</b> - " +
              nama +

              "<br>" +

              tingkat +
              " - " +
              jurusan +
              " - " +
              kelas +

              "</button>";

          }
        );


        hasil.innerHTML =
          html;


        bersihkanCallback(
          "cariManualApi",
          callbackName
        );

      };


    const script =
      document.createElement("script");


    script.id =
      "cariManualApi";


    script.src =

      GAS_URL +

      "?aksi=cariManual" +

      "&teks=" +
      encodeURIComponent(teks) +

      "&callback=" +
      callbackName;


    document.body.appendChild(script);

  }


  // =====================================================
  // PILIH SISWA MANUAL
  // =====================================================

  function pilihSiswaManual(
    idSiswa,
    nama
  ) {

    document
      .getElementById("manualKode")
      .value =
        idSiswa;


    document
      .getElementById("manualCari")
      .value =
        idSiswa +
        " - " +
        nama;


    document
      .getElementById(
        "hasilPencarianManual"
      )
      .innerHTML =

        "<b>✓ Siswa dipilih:</b><br>" +

  // =====================================================
  // MULAI SCANNER
  // =====================================================

  function mulaiScanner() {

    if (!petugas) {

      alert(
        "Silakan login terlebih dahulu."
      );

      return;

    }


    // Sembunyikan manual

    document
      .getElementById("manualArea")
      .style.display =
        "none";


    // Tampilkan scanner

    document
      .getElementById("scannerArea")
      .style.display =
        "block";


    // Bersihkan scanner lama

    document
      .getElementById("reader")
      .innerHTML =
        "";


    document
      .getElementById("hasil")
      .innerHTML =
        "Menyalakan kamera...";


    try {

      scannerAktif =
        new Html5QrcodeScanner(

          "reader",

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 150
            }
          },

          false

        );


      scannerAktif.render(

        function(kode) {

          if (scannerAktif) {

            scannerAktif
              .clear()
              .catch(
                function() {}
              );

          }


          scannerAktif = null;


          berhasilScan(kode);

        },


        function(error) {

          // Error frame tidak ditampilkan

        }

      );


    } catch (error) {

      document
        .getElementById("hasil")
        .innerHTML =

          "❌ Kamera tidak dapat dijalankan." +

          "<br><br>" +

          error.message;

    }

  }

        "<br><br>" +

        "Kode: <b>" +
        kode +
        "</b>" +

        "<br><br>" +

        "Mencatat kehadiran...";


    catatKehadiran(kode);

  }

    const script =

      callbackName;


    document.body.appendChild(script);

  // =====================================================

  // =====================================================

  function bukaTindakLanjut() {

    if (!petugas) {

      alert(
        "Silakan login terlebih dahulu."
      );

      return;

    }


    const area =
      document.getElementById(
        "tindakLanjutArea"
      );


    area.innerHTML =
      "<div class='info'>" +
      "Memuat data tindak lanjut..." +
      "</div>";


    const callbackName =
      "tindakLanjutCallback" + Date.now();


    window[callbackName] =
      function(data) {

        if (
          !data ||
          data.berhasil !== true
        ) {

          area.innerHTML =

            "<div class='info'>" +

            "❌ Gagal mengambil data tindak lanjut." +

            "<br><br>" +

            (
              data &&
              data.pesan
                ? data.pesan
                : "Tidak ada respons dari server."
            ) +

            "</div>";


          bersihkanCallback(
            "tindakLanjutApi",
            callbackName
          );

          return;

        }


        if (
          Number(data.jumlah) === 0
        ) {

          area.innerHTML =

            "<div class='info'>" +

            "✅ Tidak ada siswa yang perlu " +
            "ditindaklanjuti." +

            "</div>";

        } else {

          let html =

            "<h3>⚠️ Perlu Tindak Lanjut</h3>";


          if (
            Array.isArray(data.data)
          ) {

            data.data.forEach(
              function(item) {

                html +=

                  "<div class='tindak-card'>" +

                  "<strong>" +
                  (item.idSiswa || "") +
                  " - " +
                  (item.nama || "") +
                  "</strong>" +

                  "<br><br>" +

                  "Kelas: " +
                  (item.tingkat || "") +
                  " - " +
                  (item.jurusan || "") +
                  " - " +
                  (item.kelas || "") +

                  "<br>" +

                  "ALPA: <strong>" +
                  (item.jumlahAlpa || 0) +
                  " kali</strong>" +

                  "<br>" +

                  "Terlambat: <strong>" +
                  (item.jumlahTerlambat || 0) +
                  " kali</strong>" +

                  "<br>" +

                  "Sakit: " +
                  (item.jumlahSakit || 0) +
                  " kali" +

                  "<br>" +

                  "Izin: " +
                  (item.jumlahIzin || 0) +
                  " kali" +

                  "<br>" +

                  "Tanggal terakhir: " +
                  (item.tanggal || "-") +

                  "<br>" +

                  "Status terakhir: <strong>" +
                  (item.status || "-") +
                  "</strong>" +

                  "<br><br>" +

                  "<button " +
                  "type='button' " +
                  "class='tindak-button' " +
                  "onclick=\"tindaklanjutiSiswa('" +
                  String(item.idSiswa || "")
                    .replace(/\\/g, "\\\\")
                    .replace(/'/g, "\\'") +
                  "')\">" +
                  "✓ SUDAH DITINDAKLANJUTI" +
                  "</button>" +

                  "</div>";

              }
            );

          }


          area.innerHTML =
            html;

        }


        bersihkanCallback(
          "tindakLanjutApi",
          callbackName
        );

      };


    const script =
      document.createElement("script");


    script.id =
      "tindakLanjutApi";


    script.src =

      GAS_URL +

      "?aksi=tindakLanjut" +

      "&callback=" +
      callbackName;


    document.body.appendChild(script);

  }

      "simpanTindakLanjutApi";


    script.src =

      "?aksi=simpanTindakLanjut" +

      "&idPetugas=" +
      encodeURIComponent(

      ) +

      "&catatan=" +
      encodeURIComponent(catatan) +

  // =====================================================
  // PENGATURAN HARI LIBUR
  // =====================================================

  function tanggalHariIniLocal() {
    const sekarang = new Date();
    const tahun = sekarang.getFullYear();
    const bulan = String(sekarang.getMonth() + 1).padStart(2, "0");
    const tanggal = String(sekarang.getDate()).padStart(2, "0");
    return tahun + "-" + bulan + "-" + tanggal;
  }

  function escapeHtmlLibur(teks) {
    return String(teks == null ? "" : teks)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function bukaPengaturanLibur() {
    if (!petugas) {
      alert("Silakan login terlebih dahulu.");
      return;
    }

    const area = document.getElementById("liburArea");

    area.style.display = "block";

    area.innerHTML =
      "<h3>📅 Pengaturan Hari</h3>" +
      "<p>Sabtu tetap dihitung sebagai hari sekolah. Hanya Minggu yang otomatis hari libur.</p>" +

      "<label><b>Tanggal</b></label>" +
      "<input type='date' id='tanggalLibur' value='" +
      tanggalHariIniLocal() +
      "' onchange='cekStatusLibur()'>" +

      "<div id='statusLibur' class='libur-status'>" +
      "Memeriksa status tanggal..." +
      "</div>" +

      "<label><b>Keterangan</b></label>" +
      "<textarea id='keteranganLibur' placeholder='Contoh: HUT Kemerdekaan RI, kegiatan sekolah, libur khusus, dll.'></textarea>" +

      "<button type='button' class='libur-simpan' onclick='simpanHariLibur()'>" +
      "🔴 JADIKAN HARI LIBUR" +
      "</button>" +

      "<button type='button' class='libur-batal' onclick='tutupPengaturanLibur()'>" +
      "✕ TUTUP" +
      "</button>";

    cekStatusLibur();
  }

  function tutupPengaturanLibur() {
    const area = document.getElementById("liburArea");
    area.innerHTML = "";
    area.style.display = "none";
  }

  function cekStatusLibur() {
    const tanggal =
      document.getElementById("tanggalLibur") &&
      document.getElementById("tanggalLibur").value;

    const status =
      document.getElementById("statusLibur");

    if (!tanggal || !status) {
      return;
    }

    status.className = "libur-status";
    status.innerHTML = "⏳ Memeriksa status hari...";

    const callbackName =
      "cekLiburCallback" + Date.now();

    window[callbackName] = function(data) {
      if (!data || data.berhasil !== true) {
        status.className = "libur-status";
        status.innerHTML =
          "❌ " +
          (
            data && data.pesan
              ? escapeHtmlLibur(data.pesan)
              : "Status hari belum dapat diperiksa."
          );

        bersihkanCallback(
          "cekLiburApi",
          callbackName
        );
        return;
      }

      const hari =
        data.hari ||
        "";

      const isLibur =
        data.libur === true ||
        String(data.status || "").toUpperCase() === "LIBUR";

      const keterangan =
        data.keterangan ||
        "";

      document.getElementById("keteranganLibur").value =
        keterangan;

      if (isLibur) {
        status.className = "libur-status libur";

        status.innerHTML =
          "🔴 <b>LIBUR</b>" +
          "<br>" +
          escapeHtmlLibur(hari) +
          "<br>" +
          "Keterangan: " +
          escapeHtmlLibur(keterangan || "-");
      } else {
        status.className = "libur-status sekolah";

        status.innerHTML =
          "🟢 <b>HARI SEKOLAH</b>" +
          "<br>" +
          escapeHtmlLibur(hari) +
          "<br>" +
          "Tanggal ini masih dianggap hari sekolah.";
      }

      bersihkanCallback(
        "cekLiburApi",
        callbackName
      );
    };

    const script = document.createElement("script");

    script.id = "cekLiburApi";

    script.src =
      GAS_URL +
      "?aksi=cekLibur" +
      "&tanggal=" +
      encodeURIComponent(tanggal) +
      "&callback=" +
      callbackName;

    document.body.appendChild(script);
  }

  function simpanHariLibur() {
    if (!petugas) {
      alert("Petugas belum login.");
      return;
    }

    const tanggal =
      document.getElementById("tanggalLibur").value;

    const keterangan =
      document.getElementById("keteranganLibur").value.trim();

    const status =
      document.getElementById("statusLibur");

    if (!tanggal) {
      status.className = "libur-status";
      status.innerHTML =
        "⚠️ Pilih tanggal terlebih dahulu.";
      return;
    }

    if (!keterangan) {
      status.className = "libur-status";
      status.innerHTML =
        "⚠️ Keterangan hari libur wajib diisi.";
      return;
    }

    status.className = "libur-status";
    status.innerHTML =
      "⏳ Menyimpan pengaturan hari libur...";

    const callbackName =
      "simpanLiburCallback" + Date.now();

    window[callbackName] = function(data) {
      if (data && data.berhasil === true) {
        status.className = "libur-status libur";

        status.innerHTML =
          "✅ <b>Hari berhasil ditetapkan sebagai LIBUR.</b>" +
          "<br><br>" +
          "Tanggal: " +
          escapeHtmlLibur(data.tanggal || tanggal) +
          "<br>" +
          "Keterangan: " +
          escapeHtmlLibur(
            data.keterangan || keterangan
          );

      } else {
        status.className = "libur-status";

        status.innerHTML =
          "❌ <b>Gagal menyimpan.</b>" +
          "<br><br>" +
          (
            data && data.pesan
              ? escapeHtmlLibur(data.pesan)
              : "Terjadi kesalahan."
          );
      }

      bersihkanCallback(
        "simpanLiburApi",
        callbackName
      );
    };

    const script =
      document.createElement("script");

    script.id = "simpanLiburApi";

    script.src =
      GAS_URL +
      "?aksi=simpanLibur" +
      "&tanggal=" +
      encodeURIComponent(tanggal) +
      "&keterangan=" +
      encodeURIComponent(keterangan) +
      "&idPetugas=" +
      encodeURIComponent(
        petugas.idPetugas
      ) +
      "&callback=" +
      callbackName;

    document.body.appendChild(script);
  }

    document
