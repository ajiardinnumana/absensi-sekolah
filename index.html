<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Sekolah</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 10px;
      min-height: 40px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 Absensi Sekolah</h2>

  <p>Scanner barcode siswa</p>

  <div id="reader"></div>

  <div id="hasil">
    Silakan scan QR Code siswa.
  </div>

</div>

<script>

  // =====================================================
  // MASUKKAN URL WEB APP GAS DI SINI
  // =====================================================

  const GAS_URL = "https://script.google.com/macros/s/AKfycbxSXinXPPm7qIl_5J99eMKfsHEo-nCZ8MWI-KNt0KsnR4W7mTL-uE4dagGneVg3c_aX/exec";


  // =====================================================
  // SCAN BERHASIL
  // =====================================================

  function berhasilScan(kode) {

    document.getElementById("hasil").innerHTML =
      "<b>Barcode terbaca!</b><br><br>" +
      "Kode: " + kode +
      "<br><br>" +
      "Mencari data siswa...";

    cariSiswa(kode);
  }


  // =====================================================
  // CARI SISWA KE GOOGLE APPS SCRIPT
  // =====================================================

  function cariSiswa(kode) {

    const callbackName =
      "callbackSiswa" + Date.now();

    window[callbackName] = function(data) {

      if (data.ditemukan === true) {

        document.getElementById("hasil").innerHTML =
          "<b>✓ SISWA DITEMUKAN</b><br><br>" +
          "<strong>" + data.nama + "</strong><br>" +
          data.tingkat + " - " +
          data.jurusan + "<br>" +
          data.kelas + "<br><br>" +
          "ID: " + data.idSiswa;

      } else {

        document.getElementById("hasil").innerHTML =
          "<b>❌ SISWA TIDAK DITEMUKAN</b><br><br>" +
          "Kode: " + kode;
      }

      delete window[callbackName];

      const script = document.getElementById("gasApi");

      if (script) {
        script.remove();
      }

      setTimeout(function() {
        mulaiScanner();
      }, 2500);
    };


    const script = document.createElement("script");

    script.id = "gasApi";

    script.src =
      GAS_URL +
      "?kode=" +
      encodeURIComponent(kode) +
      "&callback=" +
      callbackName;

    document.body.appendChild(script);
  }


  // =====================================================
  // ERROR SCAN
  // =====================================================

  function gagalScan(error) {
    // Tidak menampilkan error setiap frame kamera.
  }


  // =====================================================
  // MULAI SCANNER
  // =====================================================

  function mulaiScanner() {

    document.getElementById("reader").innerHTML = "";

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 150
        }
      },
      false
    );

    scanner.render(
      function(kode) {

        scanner.clear();

        berhasilScan(kode);

      },
      gagalScan
    );
  }


  // =====================================================
  // MULAI
  // =====================================================

  mulaiScanner();

</script>

</body>
</html>
